<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Edit Profile | Admin Panel</title>
  <link rel="stylesheet" href="../css/admin.css"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
</head>
<body data-page="profile">
<div class="admin-layout">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-logo">
        <div class="logo-icon">R</div>
        <div><span>Raymond Okinyi</span><small>Admin Panel</small></div>
      </div>
      <button class="sidebar-close" id="sidebarClose"><i class="fas fa-times"></i></button>
    </div>
    <nav class="sidebar-nav">
      <div class="nav-section-label">Main</div>
      <a href="dashboard.html" class="sidebar-link"><i class="fas fa-tachometer-alt"></i> Dashboard</a>
      <a href="messages.html" class="sidebar-link"><i class="fas fa-envelope"></i> Messages</a>
      <div class="nav-section-label">CV Management</div>
      <a href="profile.html" class="sidebar-link active"><i class="fas fa-user-edit"></i> Edit Profile</a>
      <a href="skills.html" class="sidebar-link"><i class="fas fa-chart-bar"></i> Edit Skills</a>
      <div class="nav-section-label">System</div>
      <a href="email-setup.html" class="sidebar-link"><i class="fas fa-at"></i> Email Setup</a>
      <a href="security.html" class="sidebar-link"><i class="fas fa-shield-alt"></i> Security</a>
      <a href="maintenance.html" class="sidebar-link"><i class="fas fa-tools"></i> Maintenance</a>
      <div class="nav-section-label">Navigation</div>
      <a href="../index.html" class="sidebar-link"><i class="fas fa-eye"></i> View CV</a>
    </nav>
    <div class="sidebar-footer">
      <div class="user-card">
        <div class="user-avatar">R</div>
        <div class="user-info"><strong>Raymond</strong><small>Administrator</small></div>
        <a href="javascript:void(0)" id="logoutBtn" title="Logout"><i class="fas fa-sign-out-alt"></i></a>
      </div>
    </div>
  </aside>
  <main class="admin-main">
    <header class="admin-header">
      <div class="header-left">
        <button class="sidebar-toggle" id="sidebarToggle"><i class="fas fa-bars"></i></button>
        <div class="breadcrumb">Admin &rsaquo; <strong>Edit Profile</strong></div>
      </div>
      <div class="header-right">
        <a href="../index.html" class="header-btn" title="View CV"><i class="fas fa-external-link-alt"></i></a>
      </div>
    </header>
    <div class="admin-content">
      <div class="page-header">
        <h1 class="page-title">Edit <span>Profile</span></h1>
        <p class="page-sub">Update your CV information — changes reflect on your public CV.</p>
      </div>
      <div class="alert" id="profileAlert"></div>
      <div class="card">
        <div class="card-title"><i class="fas fa-user-edit"></i> Personal Information</div>
        <form class="admin-form" id="profileForm">
          <div class="form-row">
            <div class="form-group">
              <label>Full Name</label>
              <input type="text" id="editName" placeholder="Your full name"/>
            </div>
            <div class="form-group">
              <label>Role / Title</label>
              <input type="text" id="editRole" placeholder="e.g. Computer Science Student"/>
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label>Email Address</label>
              <input type="email" id="editEmail" placeholder="your@email.com"/>
            </div>
            <div class="form-group">
              <label>Phone Number</label>
              <input type="tel" id="editPhone" placeholder="e.g. 0795058238"/>
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label>Location</label>
              <input type="text" id="editLocation" placeholder="City, Country"/>
            </div>
            <div class="form-group">
              <label>Institution / School</label>
              <input type="text" id="editSchool" placeholder="School / University name"/>
            </div>
          </div>
          <div class="form-group">
            <label>Bio / About Me</label>
            <textarea id="editBio" rows="5" placeholder="Write a short bio about yourself..."></textarea>
          </div>
          <div class="form-actions">
            <button type="submit" class="btn btn-primary"><i class="fas fa-save"></i> Save Changes</button>
            <button type="reset" class="btn btn-outline"><i class="fas fa-undo"></i> Reset</button>
          </div>
        </form>
      </div>
    </div>
  </main>
</div>
<script src="../js/api.js"></script>
<script src="../js/admin.js"></script>
</body>
</html>
